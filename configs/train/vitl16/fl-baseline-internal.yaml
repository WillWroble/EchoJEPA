app: vjepa
folder: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/checkpoints/fl/baseline_vitl_v2/internal
data:
  dataset_type: VideoDataset
  datasets:
  - /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/avi_manifest.csv
  datasets_weights: [1.0]
  batch_size: 128
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  fps: 8
  tubelet_size: 2
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0
loss:
  loss_exp: 1.0
mask:
- aspect_ratio: [0.75, 1.5]
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale: [0.15, 0.15]
  temporal_scale: [1.0, 1.0]
- aspect_ratio: [0.75, 1.5]
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale: [0.7, 0.7]
  temporal_scale: [1.0, 1.0]
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/checkpoints/fl/baseline_vitl/internal/latest.pt
  save_every_freq: 2
  seed: 234
  use_sdpa: true
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  is_anneal: false
  force_load_pretrain: false
  anneal_ckpt: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/checkpoints/vitl_vjepa2.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 300
  ipe_scale: 1.25
  
  start_lr: 4.1625e-6
  lr: 2.1875e-5
  final_lr: 2.1875e-5

  warmup: 40
  epochs: 240
federated:
  server: localhost:8080
  mode: 2
  local_steps: 100
  sync_momentum: 0.9277

