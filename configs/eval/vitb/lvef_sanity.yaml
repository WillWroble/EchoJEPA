# configs/eval/vitb/lvef_sanity.yaml
# Quick LVEF probe sanity check on EchoJEPA e60 checkpoint
app: vjepa
cpus_per_task: 8
folder: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/checkpoints/eval_probes/lvef_sanity
mem_per_gpu: 60G
nodes: 1
tasks_per_node: 1
num_workers: 8
eval_name: video_classification_frozen
resume_checkpoint: false
tag: lvef-sanity-e60
experiment:
  classifier:
    task_type: regression
    num_targets: 1
    num_heads: 8
    num_probe_blocks: 2
  data:
    dataset_type: VideoDataset
    dataset_train: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/data/lvef_train_small.csv
    dataset_val: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/data/lvef_val_small.csv
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 1
    num_views_per_segment: 1
    target_mean: 0.6108
    target_std: 0.0736
  optimization:
    batch_size: 16
    multihead_kwargs:
    - final_lr: 0.0001
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.0001
      warmup: 5.0
      weight_decay: 0.01
    num_epochs: 15
    use_bfloat16: true
    use_pos_embed: false
model_kwargs:
  checkpoint: /lab-share/Cardio-Mayourian-e2/Public/Echo_JEPA/checkpoints/echojepa_vitb_bch/latest.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_base
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
  wrapper_kwargs:
    max_frames: 16
    use_pos_embed: false
